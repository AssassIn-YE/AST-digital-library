<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广州应用科技学院数字图书馆</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="index.html" aria-label="数字图书馆门户">
      <span>
        <strong>广应科数字图书馆</strong>
        <span>Guangzhou AST Digital Library</span>
      </span>
    </a>
  </header>

  <main class="portal-main">
    <p class="portal-note">图书馆智能体 · 课程演示版（暂未接入回复）</p>
    <h1 class="portal-title" aria-label="探索不止 求索无疆">
      <span class="title-part">探索</span><span class="title-part">不止</span><span class="title-space"> </span><span class="title-part">求索</span><span class="title-part">无疆</span>
    </h1>

    <form class="agent-box" id="agentForm" autocomplete="off">
      <textarea id="agentInput" rows="3" placeholder="问点什么，一起探索馆藏、开馆与阅读服务"></textarea>
      <div class="agent-toolbar">
        <div class="agent-chips">
          <span class="chip active">馆藏问答</span>
          <span class="chip">开馆查询</span>
        </div>
        <button class="send-btn" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>
    <div class="agent-tip" id="agentTip"></div>

    <nav class="portal-actions" aria-label="快捷入口">
      <a class="action-btn" href="group.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 19.5V6.8c0-.7.4-1.3 1-1.6l6-3.1c.6-.3 1.4-.3 2 0l6 3.1c.6.3 1 .9 1 1.6v12.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8 10h8M8 14h8M8 18h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        关于本馆
      </a>
      <a class="action-btn" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 19V7l8-4 8 4v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 19v-6h6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        进入数字图书馆
      </a>
      <a class="action-btn" href="register.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        读者登记
      </a>
    </nav>
  </main>

  <script>
    (function () {
      const form = document.getElementById("agentForm");
      const input = document.getElementById("agentInput");
      const tip = document.getElementById("agentTip");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        tip.textContent = "图书馆智能体暂未接入，请先通过下方入口进入数字图书馆。";
        input.blur();
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    })();
  </script>
</body>
</html>
